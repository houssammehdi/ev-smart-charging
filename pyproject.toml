[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ev-smart-charging"
version = "0.1.0"
description = "Smart-charging scheduler and simulator for EV sites with limited grid capacity: heuristics vs. optimal LP vs. MPC."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Houssam Mehdi" }]
requires-python = ">=3.11"
keywords = ["ev", "smart-charging", "load-management", "linear-programming", "mpc", "ocpp", "simulation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
  "hypothesis>=6.100",
  "ruff==0.16.9",
  "mypy==2.3.1",
]

[project.scripts]
evcharge = "evcharge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evcharge"]

[tool.hatch.build.targets.sdist]
include = ["src/evcharge", "tests", "examples", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "PT", "NPY", "D"]
ignore = ["D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
